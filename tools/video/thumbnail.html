<!doctype html><html><head><style>
*{margin:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:Poppins,Inter,sans-serif;
background:radial-gradient(900px 600px at 75% 40%,#0e3a5a,#06121f 70%);color:#fff;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:48px 48px}
.t{position:absolute;left:60px;top:120px;font-weight:800;line-height:.95;letter-spacing:-3px}
.t .a{font-size:150px}.t .b{font-size:150px;color:#ffc83d}
.sub{position:absolute;left:66px;top:520px;font:700 40px Poppins;color:#5fd8ff}
.stack{position:absolute;right:20px;top:150px;width:470px;height:500px}
.card{position:absolute;width:420px;background:#fff;border-radius:18px;box-shadow:0 20px 50px #0008;color:#1d2733;padding:22px 26px;font:500 22px Inter}
.card .r{display:flex;gap:16px;border-bottom:1px solid #e6eaee;padding:8px 0}.card .r span:first-child{color:#8a95a1;width:80px}
.card .l{height:12px;background:#e3e8ee;border-radius:6px;margin-top:14px}
.badge{position:absolute;right:-20px;top:-26px;background:#ffc83d;color:#06121f;font:800 34px Poppins;padding:8px 22px;border-radius:40px;transform:rotate(6deg)}
.brand{position:absolute;left:66px;bottom:44px;font:700 24px Poppins;letter-spacing:6px;color:#5fd8ffaa}
</style></head><body><div class="grid"></div>
<div class="t"><div class="a">111 EMAILS.</div><div class="b">1 NIGHT.</div></div>
<div class="sub">Each one personal, with AI</div>
<div class="stack">
 <div class="card" style="left:60px;top:0;transform:rotate(6deg);opacity:.55"><div class="r"><span>To</span><span>dean@school.example</span></div><div class="l"></div><div class="l" style="width:70%"></div></div>
 <div class="card" style="left:30px;top:40px;transform:rotate(3deg);opacity:.8"><div class="r"><span>To</span><span>info@college.example</span></div><div class="l"></div><div class="l" style="width:60%"></div></div>
 <div class="card" style="left:0;top:90px"><div class="r"><span>To</span><span>dean@northview.example</span></div><div class="r"><span>Subject</span><span>Training for Northview students</span></div>
 <div style="margin-top:14px;line-height:1.5">Attention: <b style="background:#fff3c4">Dr. Santos, Dean</b><br>Dear Ma'am/Sir…</div><div class="l"></div><div class="l" style="width:55%"></div>
 <div style="margin-top:16px;color:#6b7783;font-size:19px">📎 Proposal.pdf</div><div class="badge">×111</div></div>
</div>
<div class="brand">AI SALES OFFICE PH</div></body></html>
